pre-commit:
  parallel: true
  commands:
    lint:
      glob: "packages/better-effect/src/**/*.ts"
      run: bunx oxlint --type-aware {staged_files}
      stage_fixed: true
    format:
      glob: "packages/better-effect/src/**/*.ts"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    typecheck:
      glob: "{packages/better-effect,apps/docs}/**/*.{ts,tsx,json}"
      run: bun run typecheck
