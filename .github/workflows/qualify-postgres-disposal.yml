name: Qualify PostgreSQL disposal
on:
  push:
    branches: [fix/mq-flow-lease-handoff]
permissions:
  contents: write
concurrency:
  group: qualify-postgres-disposal
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/fix/mq-flow-lease-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Verify the admitted native transaction outlives disposal before the patch
        run: |
          bun run build --filter=better-effect-mq-postgres... > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          set +e
          bun packages/better-effect-mq-postgres/tests/integration/store-dispose.ts > /tmp/dispose-red.log 2>&1
          result=$?
          set -e
          cat /tmp/dispose-red.log
          test "$result" -ne 0
          grep -F 'Disposal returned before COMMIT and client release' /tmp/dispose-red.log
      - name: Drain admitted native transactions and retire the source transport
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const staged = new Map()
          function patch(path, changes) {
            let text = readFileSync(path, 'utf8')
            for (const [before, after] of changes) {
              assert.equal(text.split(before).length - 1, 1, `Missing or repeated anchor in ${path}: ${before}`)
              text = text.replace(before, after)
            }
            staged.set(path, text)
          }
          patch('packages/better-effect-mq-postgres/src/store.ts', [
            ['  private disposal: Promise<void> | undefined', `  private disposal: Promise<void> | undefined
              private readonly transactions = new Set<Promise<void>>()`],
            [`  private async withTx<T>(
              operation: string,
              body: (tx: Tx) => Promise<T>
            ): Promise<StoreResult<T>> {
              if (this.closed) return fail(operation, new Error('store is closed'))`,
             `  private withTx<T>(
              operation: string,
              body: (tx: Tx) => Promise<T>
            ): Promise<StoreResult<T>> {
              if (this.closed) return Promise.resolve(fail(operation, new Error('store is closed')))
              // Admission is synchronous with closing. A cancelled Worker wait does
              // not cancel PostgreSQL SQL, so disposal must retain its actual lifetime.
              const pending = this.runTransaction(operation, body)
              const drained = pending.then(() => undefined, () => undefined)
              this.transactions.add(drained)
              void drained.then(() => { this.transactions.delete(drained) })
              return pending
            }

            private async runTransaction<T>(
              operation: string,
              body: (tx: Tx) => Promise<T>
            ): Promise<StoreResult<T>> {`],
            [`  private async disposeResources(): Promise<void> {
              for (const waiter of this.waiters) {
                this.finishWaiter(waiter, fail('awaitWake', new Error('store is closed')))
              }`,
             `  private async disposeResources(): Promise<void> {
              for (const waiter of this.waiters) {
                this.finishWaiter(waiter, fail('awaitWake', new Error('store is closed')))
              }
              // Drain this store's work, not the application's shared pool. Each
              // promise includes commit/rollback and release of its checked-out client.
              await Promise.all(this.transactions)`]
          ])
          patch('packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts', [
            [`    console.log(
                'PASS: concurrency-one mixed-failure and empty flows collect exactly once under a new active lease'
              )`, ''],
            [`    await runtime.dispose()
              await flows.dispose()
            }
          }`,
             `    await runtime.dispose()
              await flows.dispose()
            }
            assert.deepEqual(workerErrors, [])
            console.log('PASS: concurrency-one mixed-failure and empty flows collect under a new lease and dispose cleanly')
          }`],
            [`  await pool.query(\`DROP SCHEMA IF EXISTS "\${schema}" CASCADE\`)
            await pool.end()
            clearTimeout(deadline)`,
             `  try {
              await pool.query(\`DROP SCHEMA IF EXISTS "\${schema}" CASCADE\`)
            } finally {
              await pool.end()
              clearTimeout(deadline)
            }`]
          ])
          for (const [path, text] of staged) writeFileSync(path, text)
          NODE
          bunx --no-install oxfmt --write packages/better-effect-mq-postgres/src/store.ts packages/better-effect-mq-postgres/tests/integration/store-dispose.ts packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts
          git rm .github/workflows/qualify-postgres-disposal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix(mq-postgres): drain admitted transactions before borrowed-store disposal'
          git push origin HEAD:fix/mq-flow-lease-handoff
      - name: Run the unchanged draining regression after the patch
        run: bun packages/better-effect-mq-postgres/tests/integration/store-dispose.ts
      - name: Rebuild and verify native handoff through cleanup
        run: |
          bun run build --filter=better-effect-mq-postgres... > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
          bun packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts
          bun packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts --worker
      - name: Preserve core and adapter qualification
        if: always()
        run: |
          for package in better-effect-mq better-effect-mq-postgres; do
            (cd packages/$package && bun run typecheck && bun test && bun run lint && bun run format:check) > /tmp/$package.log 2>&1 || { tail -160 /tmp/$package.log; exit 1; }
            tail -12 /tmp/$package.log
          done
          git diff --exit-code
