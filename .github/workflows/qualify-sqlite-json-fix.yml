name: Verify SQLite schedule JSON fix
on:
  push:
    branches: [fix/sqlite-schedule-json]
permissions:
  contents: write
concurrency:
  group: qualify-sqlite-json-fix
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/fix/sqlite-schedule-json'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Build dependencies and observe the original regression
        run: |
          bun run build --filter=better-effect-mq-sqlite... > /tmp/sqlite-build.log 2>&1 || { tail -100 /tmp/sqlite-build.log; exit 1; }
          set +e
          bun test packages/better-effect-mq-sqlite/tests/schedule-json.test.ts > /tmp/sqlite-red.log 2>&1
          result=$?
          set -e
          cat /tmp/sqlite-red.log
          test "$result" -ne 0
          grep -F '(fail) SQLite schedules preserve decoded JSON' /tmp/sqlite-red.log
      - name: Keep decoded JSON out of the SQL text parser
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          const path = 'packages/better-effect-mq-sqlite/src/SqliteJobScheduleStore.ts'
          let source = readFileSync(path, 'utf8')
          const before = "  const payload = parseJson(record.payload, 'payload')"
          const after = "  // ScheduleRecord.payload is already decoded; strings must not be parsed again.\n  const payload = snapshotJson(record.payload, 'payload')\n  if (Result.isError(payload)) throw payload.error"
          assert.equal(source.split(before).length - 1, 1)
          source = source.replace(before, after)
          const field = '    ...record,\n    job: Object.freeze({ ...record.job }),\n    payload,'
          assert.equal(source.split(field).length - 1, 1)
          source = source.replace(field, '    ...record,\n    job: Object.freeze({ ...record.job }),\n    payload: payload.value,')
          writeFileSync(path, source)
          NODE
          bunx --no-install oxfmt --write packages/better-effect-mq-sqlite/src/SqliteJobScheduleStore.ts packages/better-effect-mq-sqlite/tests/schedule-json.test.ts packages/better-effect-mq-sqlite/tests/package/consumer/schedule-json.mjs packages/better-effect-mq-sqlite/tests/package/external-consumer.ts
      - name: Verify unchanged assertions after the fix
        run: bun test packages/better-effect-mq-sqlite/tests/schedule-json.test.ts
      - name: Qualify the complete SQLite package including installed Node and Bun
        working-directory: packages/better-effect-mq-sqlite
        run: bun run check > /tmp/sqlite-check.log 2>&1 || { tail -180 /tmp/sqlite-check.log; exit 1; }
      - name: Persist the qualified source and retire this one-shot workflow
        run: |
          git rm .github/workflows/qualify-sqlite-json-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/better-effect-mq-sqlite
          git commit -m 'fix(mq-sqlite): preserve decoded JSON when cloning schedule records'
          git push origin HEAD:fix/sqlite-schedule-json
          tail -20 /tmp/sqlite-check.log
