name: Format Better Auth P0

on:
  workflow_dispatch:
  push:
    branches:
      - feat/better-auth-effectful-service

permissions:
  contents: write

concurrency:
  group: format-better-auth-p0
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/better-auth-effectful-service

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Better Auth package
        working-directory: packages/better-effect-better-auth
        run: bun run format

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- packages/better-effect-better-auth; then
            echo "Formatting already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/better-effect-better-auth
          git commit -m "style: format Better Auth P0 implementation"
          git push origin HEAD:feat/better-auth-effectful-service
