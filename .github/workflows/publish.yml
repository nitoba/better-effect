name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag to validate and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to validate and publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/better-effect/package.json').version")"
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::release tag must use the v<version> format"
            exit 1
          fi

          RELEASE_VERSION="$RELEASE_TAG"
          RELEASE_VERSION="${RELEASE_VERSION#v}"

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match release tag ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Test
        run: bun test

      - name: Validate package
        run: bun run publint

      - name: Inspect package contents
        working-directory: packages/better-effect
        run: bun pm pack --dry-run

      - name: Publish
        working-directory: packages/better-effect
        run: npm publish --workspaces=false --access public --ignore-scripts
