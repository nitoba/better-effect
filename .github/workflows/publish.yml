name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: Qualified Git tag to validate and publish
        required: true
        type: string
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the selected package to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Verify exact tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          tag_ref="refs/tags/$RELEASE_TAG"
          if git symbolic-ref --quiet HEAD >/dev/null; then
            echo "::error::publish checkout must be detached at the tag commit"
            exit 1
          fi

          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::expected tag ref $tag_ref was not checked out"
            exit 1
          fi

          tag_commit="$(git rev-parse --verify --end-of-options "${tag_ref}^{commit}")"
          checkout_commit="$(git rev-parse --verify --end-of-options HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "::error::checked out commit does not match $tag_ref"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Resolve allowlisted package route
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-route.ts --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install verified npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate selected manifest, tag, and release notes
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          manifest_name="$(bun -e "const pkg = await Bun.file('$PACKAGE_DIR/package.json').json(); process.stdout.write(String(pkg.name))")"
          manifest_version="$(bun -e "const pkg = await Bun.file('$PACKAGE_DIR/package.json').json(); process.stdout.write(String(pkg.version))")"

          if [[ "$manifest_name" != "$PACKAGE_NAME" ]]; then
            echo "::error::selected manifest name ($manifest_name) does not match the tag route ($PACKAGE_NAME)"
            exit 1
          fi
          if [[ "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::$PACKAGE_NAME version ($manifest_version) does not match tag $RELEASE_TAG"
            exit 1
          fi
          if [[ ! -f "$CHANGELOG" ]] || ! awk -v expected="## [$RELEASE_VERSION]" '
            index($0, expected) == 1 &&
              (length($0) == length(expected) || substr($0, length(expected) + 1, 1) == " ") {
              found = 1
              exit
            }
            END { exit found ? 0 : 1 }
          ' "$CHANGELOG"; then
            echo "::error::selected package changelog has no exact [$RELEASE_VERSION] heading"
            exit 1
          fi
          if [[ "$PACKAGE_NAME" == "better-effect" ]] && grep -Fq 'workspace:' "$PACKAGE_DIR/package.json"; then
            echo "::error::core release manifest contains a workspace marker"
            exit 1
          fi

      - name: Run selected package quality gates
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PACKAGE_DIR" && bun run check)

      - name: Validate selected packed artifact
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail
          (cd "$PACKAGE_DIR" && bun run release:dry)

      - name: Install the selected artifact through Bun in an isolated consumer
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$PACKAGE_NAME" != "better-effect" ]]; then
            (cd "$PACKAGE_DIR" && bun run test:package-consumer)
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          archive_dir="$temp_dir/archive"
          consumer_dir="$temp_dir/consumer"
          mkdir -p "$archive_dir" "$consumer_dir"
          (cd "$PACKAGE_DIR" && bun pm pack --destination "$archive_dir" --ignore-scripts)
          archive="$(find "$archive_dir" -maxdepth 1 -type f -name 'better-effect-*.tgz' -print -quit)"
          test -n "$archive"
          cp "$archive" "$consumer_dir/better-effect.tgz"

          cat > "$consumer_dir/package.json" <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "better-effect": "file:./better-effect.tgz",
              "better-result": "3.0.0",
              "typescript": "6.0.3"
            }
          }
          EOF

          cat > "$consumer_dir/smoke.mjs" <<'EOF'
          import { Effect, Layer, Runtime, Service } from 'better-effect'
          import { Result } from 'better-result'

          class Greeting extends Service()('Greeting') {}
          const runtime = await Runtime.make(Layer.make(Greeting))
          const result = await runtime.run(
            Effect.fn(async function* () {
              const greeting = yield* Greeting
              return Result.ok(greeting instanceof Greeting)
            })
          )
          await runtime.dispose()

          if (!Result.isOk(result) || result.value !== true) {
            throw new Error('isolated packed core consumer smoke failed')
          }
          EOF

          (
            cd "$consumer_dir"
            bun install --ignore-scripts
            bun install --frozen-lockfile --ignore-scripts
            bun smoke.mjs
            node smoke.mjs
          )

      - name: Verify quality gates did not modify the checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish selected package with npm Trusted Publishing
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
          INITIAL_RELEASE: ${{ steps.release.outputs.initial_release }}
        shell: bash
        run: |
          set -euo pipefail
          published_version="$(npm view "$PACKAGE_NAME@$RELEASE_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null || true)"

          if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            mkdir -p "$temp_dir/local" "$temp_dir/registry" "$temp_dir/local-unpacked" "$temp_dir/registry-unpacked"
            (
              cd "$PACKAGE_DIR"
              npm pack --workspaces=false --pack-destination "$temp_dir/local" --ignore-scripts >/dev/null
            )
            npm pack "$PACKAGE_NAME@$RELEASE_VERSION" \
              --registry=https://registry.npmjs.org \
              --pack-destination "$temp_dir/registry" \
              --ignore-scripts >/dev/null
            local_archive="$(find "$temp_dir/local" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            registry_archive="$(find "$temp_dir/registry" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
            test -n "$local_archive" && test -n "$registry_archive"
            tar -xzf "$local_archive" -C "$temp_dir/local-unpacked"
            tar -xzf "$registry_archive" -C "$temp_dir/registry-unpacked"
            if ! diff -rq "$temp_dir/local-unpacked/package" "$temp_dir/registry-unpacked/package"; then
              echo "::error::published $PACKAGE_NAME@$RELEASE_VERSION does not match the selected tag artifact"
              exit 1
            fi
            echo "$PACKAGE_NAME@$RELEASE_VERSION is already published and matches the selected artifact"
            exit 0
          fi

          if [[ "$INITIAL_RELEASE" == "true" && "$RELEASE_VERSION" == "0.1.0" ]]; then
            echo "::error::$PACKAGE_NAME@$RELEASE_VERSION must be bootstrapped manually before its first qualified tag; see docs/release-process.md"
            exit 1
          fi

          (
            cd "$PACKAGE_DIR"
            npm publish --workspaces=false --access public --registry=https://registry.npmjs.org --ignore-scripts
          )
