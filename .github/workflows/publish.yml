name: Publish

on:
  workflow_call:
    inputs:
      tag_name:
        description: Git tag to validate and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to validate and publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name }}
          fetch-depth: 0

      - name: Verify exact tag commit
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::release tag must use a safe v<version> format"
            exit 1
          fi

          tag_ref="refs/tags/$RELEASE_TAG"
          if git symbolic-ref --quiet HEAD >/dev/null; then
            echo "::error::publish checkout must be detached at the tag commit"
            exit 1
          fi

          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::expected tag ref $tag_ref was not checked out"
            exit 1
          fi

          tag_commit="$(git rev-parse --verify --end-of-options "${tag_ref}^{commit}")"
          checkout_commit="$(git rev-parse --verify --end-of-options HEAD)"
          if [[ "$checkout_commit" != "$tag_commit" ]]; then
            echo "::error::checked out commit does not match $tag_ref"
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install verified npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(bun -e "const pkg = await Bun.file('packages/better-effect/package.json').json(); process.stdout.write(String(pkg.version))")"

          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == vv* ]]; then
            echo "::error::release tag must use the v<version> format"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if ! VERSION_TO_VALIDATE="$RELEASE_VERSION" bun -e '
            const version = process.env.VERSION_TO_VALIDATE
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/

            if (!semver.test(version)) process.exit(1)
          '; then
            echo "::error::release tag must contain a valid SemVer version"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match release tag ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Run quality gates
        run: bun run check

      - name: Inspect packed package and run consumer smoke test
        working-directory: packages/better-effect
        shell: bash
        run: |
          set -euo pipefail
          package_root="$PWD"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          bun pm pack --destination "$temp_dir" --ignore-scripts
          archive="$(find "$temp_dir" -maxdepth 1 -type f -name 'better-effect-*.tgz' -print -quit)"
          test -n "$archive"

          tar -tzf "$archive" | grep -Fx 'package/LICENSE'
          tar -tzf "$archive" | grep -Fx 'package/README.md'
          tar -tzf "$archive" | grep -Fx 'package/dist/index.mjs'

          mkdir -p "$temp_dir/consumer/node_modules"
          tar -xzf "$archive" -C "$temp_dir/consumer/node_modules"
          mv "$temp_dir/consumer/node_modules/package" "$temp_dir/consumer/node_modules/better-effect"
          for dependency in better-result hono iti; do
            ln -s "$package_root/node_modules/$dependency" "$temp_dir/consumer/node_modules/$dependency"
          done

          cat > "$temp_dir/consumer/smoke.mjs" <<'EOF'
          import { Effect, Layer, Runtime, Service } from 'better-effect'
          import 'better-effect/adapters/iti'
          import 'better-effect/hono'
          import 'better-effect/runtime/explicit'
          import 'better-effect/runtime/node'
          import 'better-effect/standard-services'
          import 'better-effect/testing'
          import { Result } from 'better-result'

          class Greeting extends Service()('Greeting') {}

          const runtime = await Runtime.make(Layer.make(Greeting))
          const result = await runtime.run(
            Effect.fn(async function* () {
              const greeting = yield* Greeting
              return Result.ok(greeting)
            })
          )

          if (!Result.isOk(result) || !(result.value instanceof Greeting)) {
            throw new Error('packed consumer smoke test failed')
          }

          await runtime.dispose()
          EOF

          (cd "$temp_dir/consumer" && bun smoke.mjs && node smoke.mjs)

      - name: Verify quality gates did not modify the checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Publish
        working-directory: packages/better-effect
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "better-effect@$package_version" version --registry=https://registry.npmjs.org 2>/dev/null || true)"

          if [[ "$published_version" == "$package_version" ]]; then
            echo "better-effect@$package_version is already published; treating this retry as successful"
            exit 0
          fi

          npm publish --workspaces=false --access public --ignore-scripts
