name: Regenerate Better Auth lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - feat/better-auth-foundation

permissions:
  contents: write

concurrency:
  group: regenerate-better-auth-lock
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feat/better-auth-foundation

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Regenerate lockfile
        run: bun install

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-bun-lock
          path: bun.lock
          if-no-files-found: error

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: regenerate bun lockfile after merge"
          git push origin HEAD:feat/better-auth-foundation
