name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tagged package
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets: inherit

  release:
    name: Validate tag and create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(bun -e "const pkg = await Bun.file('packages/better-effect/package.json').json(); process.stdout.write(String(pkg.version))")"

          if [[ "$RELEASE_TAG" != v* || "$RELEASE_TAG" == vv* ]]; then
            echo "::error::release tag must use the v<version> format"
            exit 1
          fi

          RELEASE_VERSION="${RELEASE_TAG#v}"
          if ! VERSION_TO_VALIDATE="$RELEASE_VERSION" bun -e '
            const version = process.env.VERSION_TO_VALIDATE
            const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/

            if (!semver.test(version)) process.exit(1)
          '; then
            echo "::error::release tag must contain a valid SemVer version"
            exit 1
          fi

          if [ "$PACKAGE_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::package.json version ($PACKAGE_VERSION) does not match release tag ($RELEASE_VERSION)"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
