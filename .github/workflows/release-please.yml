name: Release

on:
  push:
    tags:
      - 'v*'
      - 'better-effect-better-auth-v*'
      - 'better-effect-mq-v*'
      - 'better-effect-kysely-v*'
      - 'better-effect-mq-postgres-v*'
      - 'better-effect-mq-redis-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Qualified package release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tagged package
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets: inherit

  release:
    name: Validate tag and create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Resolve allowlisted package route
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/release-route.ts --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate selected package release metadata
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
          CHANGELOG: ${{ steps.release.outputs.changelog }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail

          manifest_name="$(bun -e "const pkg = await Bun.file('$PACKAGE_DIR/package.json').json(); process.stdout.write(String(pkg.name))")"
          manifest_version="$(bun -e "const pkg = await Bun.file('$PACKAGE_DIR/package.json').json(); process.stdout.write(String(pkg.version))")"
          if [[ "$manifest_name" != "$PACKAGE_NAME" || "$manifest_version" != "$RELEASE_VERSION" ]]; then
            echo "::error::tag does not match the selected package manifest"
            exit 1
          fi
          if [[ ! -f "$CHANGELOG" ]] || ! awk -v expected="## [$RELEASE_VERSION]" '
            index($0, expected) == 1 &&
              (length($0) == length(expected) || substr($0, length(expected) + 1, 1) == " ") {
              found = 1
              exit
            }
            END { exit found ? 0 : 1 }
          ' "$CHANGELOG"; then
            echo "::error::selected package changelog has no exact [$RELEASE_VERSION] heading"
            exit 1
          fi

          release_notes="$RUNNER_TEMP/release-notes.md"
          awk -v expected="## [$RELEASE_VERSION]" '
            index($0, expected) == 1 &&
              (length($0) == length(expected) || substr($0, length(expected) + 1, 1) == " ") {
              found = 1
              print
              next
            }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' "$CHANGELOG" > "$release_notes"
          test -s "$release_notes"
          echo "RELEASE_NOTES=$release_notes" >> "$GITHUB_ENV"

      - name: Create package-specific GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.release_version }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --notes-file "$RELEASE_NOTES" \
              --title "$PACKAGE_NAME@$PACKAGE_VERSION"
          fi
