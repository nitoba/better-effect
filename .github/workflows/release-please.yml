name: Release

on:
  push:
    tags:
      - 'v*'
      - 'better-effect-better-auth-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Qualified package release tag
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tagged package
    uses: ./.github/workflows/publish.yml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets: inherit

  release:
    name: Validate tag and create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag_name || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Validate selected package release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            package_name="better-effect"
            package_dir="packages/better-effect"
            changelog="CHANGELOG.md"
            release_version="${RELEASE_TAG#v}"
          elif [[ "$RELEASE_TAG" =~ ^better-effect-better-auth-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            package_name="better-effect-better-auth"
            package_dir="packages/better-effect-better-auth"
            changelog="$package_dir/CHANGELOG.md"
            release_version="${RELEASE_TAG#better-effect-better-auth-v}"
          else
            echo "::error::tag is not an allowlisted package release tag"
            exit 1
          fi

          manifest_name="$(bun -e "const pkg = await Bun.file('$package_dir/package.json').json(); process.stdout.write(String(pkg.name))")"
          manifest_version="$(bun -e "const pkg = await Bun.file('$package_dir/package.json').json(); process.stdout.write(String(pkg.version))")"
          if [[ "$manifest_name" != "$package_name" || "$manifest_version" != "$release_version" ]]; then
            echo "::error::tag does not match the selected package manifest"
            exit 1
          fi
          if [[ ! -f "$changelog" ]] || ! grep -Eq "^## \[$release_version\]( |$)" "$changelog"; then
            echo "::error::selected package changelog has no exact [$release_version] heading"
            exit 1
          fi

          {
            echo "PACKAGE_NAME=$package_name"
            echo "PACKAGE_VERSION=$release_version"
            echo "CHANGELOG=$changelog"
          } >> "$GITHUB_ENV"

      - name: Create package-specific GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --notes-file "$CHANGELOG" \
              --title "$PACKAGE_NAME@$PACKAGE_VERSION"
          fi
