name: Refine and qualify flow handoff
on:
  push:
    branches: [fix/mq-flow-lease-handoff]
permissions:
  contents: write
concurrency:
  group: refine-flow-handoff
  cancel-in-progress: false
jobs:
  qualify:
    if: github.ref == 'refs/heads/fix/mq-flow-lease-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - name: Apply verified boundary changes and retire this workflow
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          function patch(path, changes) {
            let text = readFileSync(path, 'utf8')
            for (const [before, after] of changes) {
              assert.equal(text.split(before).length - 1, 1, `Missing or repeated anchor in ${path}: ${before}`)
              text = text.replace(before, after)
            }
            writeFileSync(path, text)
          }
          patch('packages/better-effect-mq/src/worker/supervisor.ts', [[
            '      undefined,\n      1,\n      1,\n      undefined,\n      this.jobStores.get(group.store.serviceTag)',
            `      undefined,
                this.workerOptions.pollIntervalMs,
                // Waiting for a notification is expected to last the polling interval.
                // Give a cooperative adapter time to settle after the poll aborts it;
                // an unresponsive adapter remains bounded by the operation deadline.
                this.workerOptions.pollIntervalMs + this.workerOptions.storeOperationTimeoutMs,
                controller.signal,
                this.jobStores.get(group.store.serviceTag)`
          ]])
          patch('packages/better-effect-mq/src/worker/types.ts', [[
            '    ? FlowHandlerRequirements<Definition, FanOutRequirements, CollectRequirements>',
            '    ? WithoutJobContext<FlowHandlerRequirements<Definition, FanOutRequirements, CollectRequirements>>'
          ]])
          patch('packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts', [
            ["import { Pool } from 'pg'", "import { Pool } from 'pg'\nimport type { WorkerErrorHandler } from 'better-effect-mq'"],
            ['    assert.equal(heartbeat.renewed[0]?.id, ordinary.id)', `    const renewedOrdinary = valueOf(await jobs.getJob({ jobId: ordinary.id }))
              assert.equal(renewedOrdinary?.leaseToken, ordinary.leaseToken)
              assert.equal(renewedOrdinary?.leaseExpiresAt, now + 3 + 60_000)`],
            ['  const workerErrors: unknown[] = []', `  const workerErrors: unknown[] = []
            const captureError: WorkerErrorHandler = (error) => { workerErrors.push(error) }`],
            ['        onError: (error) => {\n          workerErrors.push(error)\n        }', '        onError: captureError']
          ])
          NODE
          bunx --no-install oxfmt --write packages/better-effect-mq/src/worker/supervisor.ts packages/better-effect-mq/src/worker/types.ts packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts
          git rm .github/workflows/refine-flow-handoff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'fix(mq): keep wake waits cancellable and provide JobContext within flow phases'
          git push origin HEAD:fix/mq-flow-lease-handoff
      - name: Build exact candidate sources
        id: build
        run: bun run build --filter=better-effect-mq-postgres... > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Native PostgreSQL lease and Worker regressions
        run: |
          bun packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts
          bun packages/better-effect-mq-postgres/tests/integration/flow-handoff.ts --worker
      - name: Core and adapter quality checks
        if: always() && steps.build.outcome == 'success'
        run: |
          for package in better-effect-mq better-effect-mq-postgres; do
            (cd packages/$package && bun run typecheck && bun test && bun run lint && bun run format:check) > /tmp/$package.log 2>&1 || { tail -160 /tmp/$package.log; exit 1; }
            tail -12 /tmp/$package.log
          done
          git diff --exit-code
