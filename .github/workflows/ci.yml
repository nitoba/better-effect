name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install verified npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates (including fresh packed NodeRuntime child tests)
        run: bun run build && bun run check

      - name: Inspect packed package and run consumer smoke test
        working-directory: packages/better-effect
        shell: bash
        run: |
          set -euo pipefail
          package_root="$PWD"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          bun pm pack --destination "$temp_dir" --ignore-scripts
          archive="$(find "$temp_dir" -maxdepth 1 -type f -name 'better-effect-*.tgz' -print -quit)"
          test -n "$archive"

          tar -tzf "$archive" | grep -Fx 'package/LICENSE'
          tar -tzf "$archive" | grep -Fx 'package/README.md'
          tar -tzf "$archive" | grep -Fx 'package/dist/index.mjs'
          tar -tzf "$archive" | grep -Fx 'package/dist/node.mjs'
          tar -tzf "$archive" | grep -Fx 'package/dist/next.mjs'
          tar -tzf "$archive" | grep -Fx 'package/dist/next.d.mts'

          mkdir -p "$temp_dir/consumer/node_modules"
          tar -xzf "$archive" -C "$temp_dir/consumer/node_modules"
          mv "$temp_dir/consumer/node_modules/package" "$temp_dir/consumer/node_modules/better-effect"
          for dependency in better-result hono iti; do
            ln -s "$package_root/node_modules/$dependency" "$temp_dir/consumer/node_modules/$dependency"
          done

          cat > "$temp_dir/consumer/smoke.mjs" <<'EOF'
          import { Effect, Layer, MapLayerBackend, Runtime, Service } from 'better-effect'
          import { NodeRuntime } from 'better-effect/node'
          import 'better-effect/adapters/iti'
          import 'better-effect/hono'
          import { NextEffect } from 'better-effect/next'
          import 'better-effect/runtime/explicit'
          import 'better-effect/runtime/node'
          import { IdGenerator, Logger } from 'better-effect/standard-services'
          import {
            IdGeneratorTest,
            layerBackendContract,
            LoggerTest,
            RecordedRuntimeObserver,
            RuntimeObserver,
            TestRuntime
          } from 'better-effect/testing'
          import { Result } from 'better-result'

          class Greeting extends Service()('Greeting') {}

          const recorded = RecordedRuntimeObserver.make()
          const runtime = await Runtime.make(
            Layer.merge(Layer.make(Greeting), Layer.make(IdGenerator)),
            {
              observers: [RuntimeObserver.compose(recorded)]
            }
          )
          const result = await runtime.run(
            Effect.fn(async function* () {
              const greeting = yield* Greeting
              const ids = yield* IdGenerator
              return Result.ok({ greeting, id: ids.next() })
            })
          )

          if (typeof NextEffect.make !== 'function') {
            throw new Error('packed NextEffect subpath smoke test failed')
          }

          if (
            !Result.isOk(result) ||
            !(result.value.greeting instanceof Greeting) ||
            typeof result.value.id !== 'string' ||
            recorded.executionStarts.length !== 1 ||
            recorded.executionEnds.length !== 1
          ) {
            throw new Error('packed consumer smoke test failed')
          }

          const mainResult = await NodeRuntime.runMain(
            Layer.empty,
            () => Result.ok('packed-main'),
            { signals: [], onSuccess: (value) => (value === 'packed-main' ? 0 : 1) }
          )

          if (!Result.isOk(mainResult) || mainResult.value !== 'packed-main') {
            throw new Error('packed NodeRuntime smoke test failed')
          }

          const logger = new LoggerTest()
          const ids = new IdGeneratorTest(['packed-test-id'])
          const testResult = await TestRuntime.use(
            Layer.make(Greeting),
            { logger, idGenerator: ids },
            (test) =>
              test.run(
                Effect.fn(async function* () {
                  const greeting = yield* Greeting
                  const testLogger = yield* Logger
                  const testIds = yield* IdGenerator
                  testLogger.info('test')
                  return Result.ok({ greeting, id: testIds.next() })
                })
              )
          )

          if (
            !Result.isOk(testResult) ||
            !(testResult.value.greeting instanceof Greeting) ||
            testResult.value.id !== 'packed-test-id'
          ) {
            throw new Error('packed TestRuntime.use smoke test failed')
          }

          if (logger.events.length !== 1) {
            throw new Error('packed TestRuntime standard service smoke test failed')
          }

          const scenario = layerBackendContract({
            makeBackend: () => new MapLayerBackend(),
            acquisitionFailure: 'retry'
          })[0]

          if (!scenario) {
            throw new Error('packed conformance scenario was not exported')
          }

          await scenario.run()
          await runtime.dispose()
          EOF

          (cd "$temp_dir/consumer" && bun smoke.mjs && node smoke.mjs)

      - name: Verify quality gates did not modify the checkout
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: better_effect
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d better_effect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build --filter=better-effect-mq-postgres

      - name: Run PostgreSQL conformance suite
        working-directory: packages/better-effect-mq-postgres
        env:
          POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/better_effect
        run: bun test tests/integration/postgres.test.ts

  redis-integration:
    name: Redis JobStore conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build --filter=better-effect-mq-redis

      - name: Run Redis JobStore conformance suite
        working-directory: packages/better-effect-mq-redis
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: bun test

  mq-storage-conformance:
    name: MQ MySQL and MongoDB storage conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run real-storage JobStore conformance
        env:
          DOCKER_HOST: unix:///var/run/docker.sock
        run: bun run test:containers

  kysely-consumer:
    name: Kysely consumer (${{ matrix.kysely }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kysely:
          - consumer-minimum
          - consumer-current-tested

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packed packages
        run: bun run build --filter=better-effect-kysely

      - name: Run external Kysely consumer cell
        working-directory: packages/better-effect-kysely
        env:
          BETTER_EFFECT_KYSELY_VERSION_CELL: ${{ matrix.kysely }}
        run: bun run test:package-consumer
