name: Format Better Auth boundary audit

on:
  push:
    branches:
      - feat/better-auth-effectful-service

permissions:
  contents: write

concurrency:
  group: format-better-auth-boundary
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/better-auth-effectful-service

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and verify the package
        shell: bash
        run: |
          cd packages/better-effect-better-auth
          bun run format
          bun run format:check

      - name: Commit formatted source
        shell: bash
        run: |
          if git diff --quiet -- packages/better-effect-better-auth; then
            echo "Better Auth package is already formatted"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/better-effect-better-auth
          git commit -m "style: format Better Auth boundary audit"
          git push origin HEAD:feat/better-auth-effectful-service
