name: Release verified PR 388 packages

on:
  push:
    branches: [release/pr-388-2026-09-11]

permissions:
  contents: write
  actions: write

concurrency:
  group: maintainer-release-pr-388
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nitoba/better-effect' && github.ref == 'refs/heads/release/pr-388-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Use the release workflow's verified npm version
        run: npm install --global npm@11.6.2
      - name: Run guarded package release scripts and dispatch existing OIDC publishing
        shell: bash
        run: |
          set -euo pipefail

          readonly repository=nitoba/better-effect
          readonly expected_main=5ceebce0171d7c519dcea4db17ee529831cd9fde
          readonly mq_version=0.1.3
          readonly postgres_version=0.1.4

          [[ $(git branch --show-current) == main ]]
          [[ $(git rev-parse HEAD) == "$expected_main" ]]
          [[ -z $(git status --porcelain) ]]
          [[ $(gh api "repos/$repository/pulls/388" --jq '.merged') == true ]]

          # Verify the merged main CI before any version or tag mutation.
          gh run watch 34641182325 --repo "$repository" --exit-status --interval 10
          [[ $(gh api "repos/$repository/actions/runs/34641182325" --jq '.head_sha') == "$expected_main" ]]
          [[ $(gh api "repos/$repository/actions/runs/34641182325" --jq '.conclusion') == success ]]

          # Resolve registry metadata successfully before treating a version as new.
          for spec in better-effect-mq:0.1.2:0.1.3 better-effect-mq-postgres:0.1.3:0.1.4; do
            IFS=: read -r name previous next <<< "$spec"
            npm view "$name" versions --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/$name-versions.json"
            latest=$(npm view "$name" dist-tags.latest --registry=https://registry.npmjs.org)
            [[ "$latest" == "$previous" ]] || { echo "Unexpected registry latest $name@$latest"; exit 1; }
            NAME="$name" PREVIOUS="$previous" NEXT="$next" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const { NAME: name, PREVIOUS: previous, NEXT: next, RUNNER_TEMP: temp } = process.env
          const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8'))
          assert.equal(manifest.name, name)
          assert.equal(manifest.version, previous)
          const versions = JSON.parse(readFileSync(join(temp, `${name}-versions.json`), 'utf8'))
          assert.ok(Array.isArray(versions) && versions.includes(previous))
          assert.ok(!versions.includes(next), `${name}@${next} is already published`)
          console.log('RELEASE PREFLIGHT', JSON.stringify({ name, previous, next }))
          NODE
            tag="$name-v$next"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag already exists; use the documented recovery route instead"
              exit 1
            fi
          done

          prepare_development_pins() {
            TARGET_PACKAGE="$1" TARGET_VERSION="$2" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const { TARGET_PACKAGE: name, TARGET_VERSION: next } = process.env
          const old = JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8')).version
          const manifests = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0')
            .filter(path => /^(packages\/[^/]+|apps\/[^/]+(?:\/web)?)\/package\.json$/.test(path))
          const changed = []
          for (const path of manifests) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'))
            let dirty = false
            if (pkg.devDependencies?.[name] === old) {
              pkg.devDependencies[name] = next
              dirty = true
            }
            if (name === 'better-effect-mq-postgres' && path === `packages/${name}/package.json`) {
              assert.equal(pkg.peerDependencies['better-effect-mq'], '>=0.1.0 <0.2.0')
              assert.equal(pkg.devDependencies['better-effect-mq'], '0.1.3')
              pkg.peerDependencies['better-effect-mq'] = '>=0.1.3 <0.2.0'
              dirty = true
            }
            if (dirty) {
              writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
              changed.push(path)
            }
          }
          if (changed.length) {
            execFileSync('git', ['add', '--', ...changed], { stdio: 'inherit' })
            execFileSync('git', ['commit', '-m', `chore(release): align development pins for ${name}@${next}`], { stdio: 'inherit' })
          }
          console.log('RELEASE PIN SYNCHRONIZATION', JSON.stringify({ name, next, changed }))
          NODE
          }

          publish_tag() {
            local tag=$1
            local package=$2
            local version=$3
            local head
            head=$(git rev-parse HEAD)
            # Token-authenticated pushes do not trigger tag workflows. Dispatch the
            # existing release entry point, preserving its OIDC identity/environment.
            gh workflow run release-please.yml --repo "$repository" --ref "$tag" -f "tag_name=$tag"
            local run_id=''
            for attempt in $(seq 1 30); do
              run_id=$(gh api "repos/$repository/actions/workflows/release-please.yml/runs?event=workflow_dispatch&branch=$tag&head_sha=$head&per_page=10" --jq '.workflow_runs[0].id // empty')
              [[ -z "$run_id" ]] || break
              sleep 2
            done
            [[ -n "$run_id" ]] || { echo "No release run found for $tag at $head"; return 1; }
            echo "RELEASE WORKFLOW $package@$version run=$run_id commit=$head"
            gh run watch "$run_id" --repo "$repository" --exit-status --interval 10
            [[ $(gh api "repos/$repository/actions/runs/$run_id" --jq '.conclusion') == success ]]
            npm view "$package@$version" name version dist.integrity dist.tarball --json --registry=https://registry.npmjs.org
            [[ $(npm view "$package@$version" version --registry=https://registry.npmjs.org) == "$version" ]]
            gh release view "$tag" --repo "$repository" --json tagName,url,name
          }

          bun install --frozen-lockfile
          bun run release:plan -- --base 42c28fb0af7882eb048ee5d4ab1c1db81142c9dd
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          prepare_development_pins better-effect-mq "$mq_version"
          bash scripts/release.sh better-effect-mq "$mq_version" > "$RUNNER_TEMP/mq-release.log" 2>&1 || { tail -200 "$RUNNER_TEMP/mq-release.log"; exit 1; }
          tail -30 "$RUNNER_TEMP/mq-release.log"
          publish_tag "better-effect-mq-v$mq_version" better-effect-mq "$mq_version"

          prepare_development_pins better-effect-mq-postgres "$postgres_version"
          bash scripts/release.sh better-effect-mq-postgres "$postgres_version" > "$RUNNER_TEMP/postgres-release.log" 2>&1 || { tail -200 "$RUNNER_TEMP/postgres-release.log"; exit 1; }
          tail -30 "$RUNNER_TEMP/postgres-release.log"
          publish_tag "better-effect-mq-postgres-v$postgres_version" better-effect-mq-postgres "$postgres_version"

          # Verify actual registry packages, not workspace or local-file candidates.
          consumer=$(mktemp -d "$RUNNER_TEMP/mq-registry-consumer-XXXXXX")
          CONSUMER="$consumer" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const directory = process.env.CONSUMER
          const manifest = {
            name: 'published-mq-regression-consumer', private: true, type: 'module',
            dependencies: {
              'better-effect-mq': '0.1.3', 'better-effect-mq-postgres': '0.1.4',
              'better-effect': '0.14.0', 'better-effect-mq-outbox': '0.1.3',
              'better-result': '^3.0.0', pg: '^8.16.3', typescript: '7.0.2'
            }
          }
          writeFileSync(join(directory, 'package.json'), JSON.stringify(manifest))
          for (const fixture of ['flow-handoff', 'handoff-admission', 'store-dispose']) {
            const source = readFileSync(`packages/better-effect-mq-postgres/tests/integration/${fixture}.ts`, 'utf8')
            assert.ok(source.includes("from '../../src/index'"))
            const installed = source.replaceAll("from '../../src/index'", "from 'better-effect-mq-postgres'")
            assert.ok(!installed.includes('../../src'))
            writeFileSync(join(directory, `${fixture}.ts`), installed)
          }
          NODE
          (
            cd "$consumer"
            bun install --ignore-scripts
            bun handoff-admission.ts
            bun flow-handoff.ts
            bun flow-handoff.ts --worker
            bun store-dispose.ts
          )
          echo 'PUBLISHED REGISTRY CONSUMER VERIFIED: native PostgreSQL admission, leases, collection and cleanup'

          git diff --exit-code
          [[ -z $(git status --porcelain) ]]
          echo "RELEASES VERIFIED: better-effect-mq@$mq_version better-effect-mq-postgres@$postgres_version"
          git log -5 --oneline
