name: Complete verified PR 388 publication

on:
  push:
    branches: [release/pr-388-2026-09-11]

permissions:
  contents: write
  actions: write

concurrency:
  group: maintainer-release-pr-388
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'nitoba/better-effect' && github.ref == 'refs/heads/release/pr-388-2026-09-11'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mq
          POSTGRES_PASSWORD: mq_test_only
          POSTGRES_DB: mq_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U mq -d mq_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GH_TOKEN: ${{ github.token }}
      MQ_TEST_DATABASE_URL: postgresql://mq:mq_test_only@localhost:5432/mq_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Use the existing release toolchain
        run: npm install --global npm@11.6.2
      - name: Verify the completed MQ release and await registry visibility without republishing
        shell: bash
        run: |
          set -euo pipefail
          readonly expected=fb0f3b8e3deaea03724a6fa4e1be095e343ba7c5
          [[ $(git branch --show-current) == main ]]
          [[ $(git rev-parse HEAD) == "$expected" ]]
          [[ $(git rev-parse 'better-effect-mq-v0.1.3^{commit}') == "$expected" ]]
          [[ -z $(git status --porcelain) ]]
          [[ $(gh api repos/nitoba/better-effect/pulls/388 --jq '.merged') == true ]]
          [[ $(gh api repos/nitoba/better-effect/actions/runs/34642208684 --jq '.conclusion') == success ]]
          [[ $(gh api repos/nitoba/better-effect/actions/runs/34642208684 --jq '.head_sha') == "$expected" ]]
          [[ $(gh api repos/nitoba/better-effect/actions/runs/34641182325 --jq '.conclusion') == success ]]
          if git show-ref --verify --quiet refs/tags/better-effect-mq-postgres-v0.1.4; then
            echo 'PostgreSQL tag already exists; stop rather than recreate an immutable release'
            exit 1
          fi
          cat > "$RUNNER_TEMP/wait-npm-version.mjs" <<'NODE'
          import assert from 'node:assert/strict'
          import { writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { setTimeout as sleep } from 'node:timers/promises'
          const [name, version] = process.argv.slice(2)
          assert.ok(['better-effect-mq', 'better-effect-mq-postgres'].includes(name))
          assert.match(version, /^0\.1\.[34]$/)
          const url = `https://registry.npmjs.org/${name}/${version}`
          let manifest
          for (let attempt = 1; attempt <= 120; attempt += 1) {
            let response
            try {
              response = await fetch(url, { headers: { 'Cache-Control': 'no-cache' }, signal: AbortSignal.timeout(15_000) })
            } catch (cause) {
              console.log('Registry read temporarily unavailable', attempt, cause instanceof Error ? cause.name : 'network error')
            }
            if (response?.ok) {
              manifest = await response.json()
              break
            }
            if (response && ![404, 429, 500, 502, 503, 504].includes(response.status)) {
              throw new Error(`Registry verification failed with HTTP ${response.status}`)
            }
            console.log('Awaiting published registry metadata', name, version, attempt, response?.status)
            await sleep(5_000)
          }
          assert.ok(manifest, `Published version ${name}@${version} did not become readable`)
          assert.equal(manifest.name, name)
          assert.equal(manifest.version, version)
          assert.match(manifest.dist?.integrity ?? '', /^sha512-/)
          assert.match(manifest.dist?.tarball ?? '', /^https:\/\/registry\.npmjs\.org\//)
          writeFileSync(join(process.env.RUNNER_TEMP, `${name}-${version}.json`), JSON.stringify(manifest))
          console.log('REGISTRY VERIFIED', JSON.stringify({ name, version, integrity: manifest.dist.integrity, tarball: manifest.dist.tarball }))
          NODE
          node "$RUNNER_TEMP/wait-npm-version.mjs" better-effect-mq 0.1.3
          gh release view better-effect-mq-v0.1.3 --repo nitoba/better-effect --json tagName,url,name
          npm view better-effect-mq-postgres versions --json --prefer-online --registry=https://registry.npmjs.org > "$RUNNER_TEMP/postgres-versions.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const versions = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'postgres-versions.json'), 'utf8'))
          assert.ok(Array.isArray(versions) && versions.includes('0.1.3'))
          assert.ok(!versions.includes('0.1.4'), 'PostgreSQL 0.1.4 already exists; do not overwrite')
          const mq = JSON.parse(readFileSync('packages/better-effect-mq/package.json', 'utf8'))
          const pg = JSON.parse(readFileSync('packages/better-effect-mq-postgres/package.json', 'utf8'))
          assert.equal(mq.version, '0.1.3')
          assert.equal(pg.version, '0.1.3')
          assert.equal(pg.devDependencies['better-effect-mq'], '0.1.3')
          assert.equal(pg.peerDependencies['better-effect-mq'], '>=0.1.0 <0.2.0')
          NODE
      - name: Prepare PostgreSQL metadata and run the existing guarded release script
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { execFileSync } from 'node:child_process'
          import { readFileSync, writeFileSync } from 'node:fs'
          const files = execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0')
            .filter(path => /^(packages\/[^/]+|apps\/[^/]+(?:\/web)?)\/package\.json$/.test(path))
          const changed = []
          for (const path of files) {
            const pkg = JSON.parse(readFileSync(path, 'utf8'))
            let dirty = false
            if (pkg.devDependencies?.['better-effect-mq-postgres'] === '0.1.3') {
              pkg.devDependencies['better-effect-mq-postgres'] = '0.1.4'
              dirty = true
            }
            if (path === 'packages/better-effect-mq-postgres/package.json') {
              assert.equal(pkg.peerDependencies['better-effect-mq'], '>=0.1.0 <0.2.0')
              pkg.peerDependencies['better-effect-mq'] = '>=0.1.3 <0.2.0'
              dirty = true
            }
            if (dirty) {
              writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
              changed.push(path)
            }
          }
          assert.ok(changed.length)
          execFileSync('git', ['add', '--', ...changed], { stdio: 'inherit' })
          execFileSync('git', ['commit', '-m', 'chore(release): require corrected MQ lifecycle in PostgreSQL 0.1.4'], { stdio: 'inherit' })
          NODE
          bash scripts/release.sh better-effect-mq-postgres 0.1.4 > "$RUNNER_TEMP/postgres-release.log" 2>&1 || { tail -180 "$RUNNER_TEMP/postgres-release.log"; exit 1; }
          tail -35 "$RUNNER_TEMP/postgres-release.log"
          [[ -z $(git status --porcelain) ]]
          echo "POSTGRES_RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish PostgreSQL through the unchanged Trusted Publishing entry point
        shell: bash
        run: |
          set -euo pipefail
          tag=better-effect-mq-postgres-v0.1.4
          gh workflow run release-please.yml --repo nitoba/better-effect --ref "$tag" -f "tag_name=$tag"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id=$(gh api "repos/nitoba/better-effect/actions/runs?event=workflow_dispatch&branch=$tag&head_sha=$POSTGRES_RELEASE_COMMIT&per_page=10" --jq '.workflow_runs[] | select(.path == ".github/workflows/release-please.yml") | .id' | head -1)
            [[ -z "$run_id" ]] || break
            sleep 2
          done
          [[ -n "$run_id" ]]
          echo "POSTGRES OIDC RELEASE run=$run_id commit=$POSTGRES_RELEASE_COMMIT"
          gh run watch "$run_id" --repo nitoba/better-effect --exit-status --interval 10
          [[ $(gh api "repos/nitoba/better-effect/actions/runs/$run_id" --jq '.conclusion') == success ]]
          node "$RUNNER_TEMP/wait-npm-version.mjs" better-effect-mq-postgres 0.1.4
          gh release view "$tag" --repo nitoba/better-effect --json tagName,url,name
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          const manifest = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'better-effect-mq-postgres-0.1.4.json'), 'utf8'))
          assert.equal(manifest.peerDependencies['better-effect-mq'], '>=0.1.3 <0.2.0')
          NODE
      - name: Verify both actual registry packages against native PostgreSQL regressions
        shell: bash
        run: |
          set -euo pipefail
          consumer=$(mktemp -d "$RUNNER_TEMP/mq-registry-consumer-XXXXXX")
          CONSUMER="$consumer" node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const directory = process.env.CONSUMER
          const manifest = { name: 'published-mq-regression-consumer', private: true, type: 'module', dependencies: {
            'better-effect-mq': '0.1.3', 'better-effect-mq-postgres': '0.1.4',
            'better-effect': '0.14.0', 'better-effect-mq-outbox': '0.1.3',
            'better-result': '^3.0.0', pg: '^8.16.3', typescript: '7.0.2'
          } }
          writeFileSync(join(directory, 'package.json'), JSON.stringify(manifest))
          for (const fixture of ['flow-handoff', 'handoff-admission', 'store-dispose', 'claim-clock']) {
            const text = readFileSync(`packages/better-effect-mq-postgres/tests/integration/${fixture}.ts`, 'utf8')
            assert.ok(text.includes("from '../../src/index'"))
            const installed = text.replaceAll("from '../../src/index'", "from 'better-effect-mq-postgres'")
            assert.ok(!installed.includes('../../src'))
            writeFileSync(join(directory, `${fixture}.ts`), installed)
          }
          NODE
          (
            cd "$consumer"
            bun install --ignore-scripts
            bun handoff-admission.ts
            bun flow-handoff.ts
            bun flow-handoff.ts --worker
            bun store-dispose.ts
            bun claim-clock.ts
          )
          echo 'REGISTRY CONSUMER VERIFIED: PostgreSQL admission, leases, collection, transaction cleanup and clock eligibility'
          git diff --exit-code
          [[ -z $(git status --porcelain) ]]
          echo 'RELEASES VERIFIED: better-effect-mq@0.1.3 better-effect-mq-postgres@0.1.4'
          git log -5 --oneline
